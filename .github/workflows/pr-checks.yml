name: PR checks

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  branch-name-policy:
    name: branch-name-policy
    runs-on: ubuntu-latest
    steps:
      - name: Allow only feature/* or fix/*
        run: |
          echo "PR head ref: ${{ github.head_ref }}"
          if [[ "${{ github.head_ref }}" != feature/* && "${{ github.head_ref }}" != fix/* ]]; then
            echo "❌ Branch name must start with feature/ or fix/"
            exit 1
          fi
          echo "✅ Branch name OK"

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: branch-name-policy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test

  build:
    name: build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
