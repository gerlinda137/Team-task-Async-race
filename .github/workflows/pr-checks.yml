name: PR checks

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  branch-name-policy:
    name: branch-name-policy
    runs-on: ubuntu-latest
    steps:
      - name: Check branch naming and source policy
        run: |
          TARGET_BRANCH="${{ github.base_ref }}"
          SOURCE_BRANCH="${{ github.head_ref }}"

          echo "Target branch: $TARGET_BRANCH"
          echo "Source branch: $SOURCE_BRANCH"

          if [[ "$TARGET_BRANCH" == "main" ]]; then
            if [[ "$SOURCE_BRANCH" != "develop" ]]; then
              echo "❌ Error: Only 'develop' can be merged into 'main'."
              exit 1
            fi
            echo "✅ Main target check passed"

          elif [[ "$TARGET_BRANCH" == "develop" ]]; then
            if [[ "$SOURCE_BRANCH" != feature/* && "$SOURCE_BRANCH" != fix/* ]]; then
              echo "❌ Error: Branch name must start with feature/ or fix/ when targeting develop."
              exit 1
            fi
            echo "✅ Develop target check passed"
          fi

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: branch-name-policy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test

  build:
    name: build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
